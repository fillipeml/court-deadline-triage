[project]
name = "court-deadline-triage"
version = "0.1.0"
description = "Court deadline triage from Brazil's national electronic gazette: a model classifies the deadline type, a deterministic engine computes the due date over versioned court calendars, a lawyer confirms"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fillipe Loose" }]
keywords = ["legal-tech", "deadlines", "court", "claude-api", "sqlite", "brazil"]
dependencies = ["requests>=2.32", "anthropic>=1.8", "pydantic>=2.13"]

[project.scripts]
deadline-triage = "deadline_triage.cli:main"
build-catalogue = "deadline_triage.catalogue_build:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadline_triage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130  # the formatter wraps code at 100; long string literals may reach 130

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
