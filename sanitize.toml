[brand]
terms = ["STG", "Schmeisser", "Terra Gomes", "stglaw", "RenavePro", "Renave", "Lagoa Quente", "HJR", "ELAW"]

[domains]
internal = ["stglaw.com.br", "stgadvogados.com.br"]

[hosts]
suffixes = ["sharepoint.com", "onmicrosoft.com"]

[allow]
# .demo/, data/ and output/ are git-ignored run outputs; the demo completes fixture case numbers with valid
# check digits at load time, so their copies in the outbox and CSV are synthetic too.
paths = ["uv.lock", ".demo/*", ".demo/**/*", "data/*", "output/*", "output/**/*"]
# Fixture case numbers are dated 2099 (a year no real case can carry) and get valid check digits at
# load time; their completed form appears in the README sample output and the demo files.
patterns = ['\d{7}-\d{2}\.2099\.\d\.\d{2}\.\d{4}']
